<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="64" y1="64" x2="960" y2="960">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b0764" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#shine)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="208.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Gamepad (d-pad and buttons cut out) -->
  <g filter="url(#shadow)">
    <path fill="url(#glyph)" fill-rule="evenodd" transform="translate(30 -60) scale(0.86)"
      d="M360 420H664C740 420 790 460 806 540L836 680C850 750 800 800 744 784C712 775 690 750 668 720L640 680H384L356 720C334 750 312 775 280 784C224 800 174 750 188 680L218 540C234 460 284 420 360 420ZM352 505h36v37h37v36h-37v37h-36v-37h-37v-36h37zM631 518a23 23 0 1 0 46 0a23 23 0 1 0-46 0zM631 602a23 23 0 1 0 46 0a23 23 0 1 0-46 0zM589 560a23 23 0 1 0 46 0a23 23 0 1 0-46 0zM673 560a23 23 0 1 0 46 0a23 23 0 1 0-46 0z"/>
  </g>

  <!-- Transfer badge: tile-coloured ring separates it from the gamepad -->
  <g filter="url(#shadow)">
    <circle cx="726" cy="726" r="150" fill="url(#glyph)" stroke="url(#bg)" stroke-width="36" paint-order="stroke"/>
  </g>
  <g fill="none" stroke="url(#bg)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M652 690H800M768 658L800 690L768 722"/>
    <path d="M800 764H652M684 732L652 764L684 796"/>
  </g>
</svg>
