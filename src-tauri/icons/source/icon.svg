      d="M200 806 C 250 786 290 786 340 806 S 430 826 480 806 S 570 786 620 806 S 710 826 760 806 S 820 790 840 798"/>
    <path fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="22" stroke-linecap="round"
      d="M290 878 C 330 862 362 862 402 878 S 474 894 514 878 S 586 862 626 878 S 698 894 738 878"/>
  </g>

  <!-- Hull -->
  <path fill="#fff" d="M196 588 H 828 a 18 18 0 0 1 16.4 25.4 L 790 736 a 28 28 0 0 1 -25.6 16.6 H 259.6 a 28 28 0 0 1 -25.6 -16.6 L 179.6 613.4 a 18 18 0 0 1 16.4 -25.4 Z"/>
  <!-- Portholes -->
  <g fill="#6544ee">
    <circle cx="372" cy="664" r="20"/>
    <circle cx="512" cy="664" r="20"/>
    <circle cx="652" cy="664" r="20"/>
  </g>

  <!-- Gamepad cargo on deck (d-pad and buttons cut out) -->
  <path fill="#fff" fill-rule="evenodd" transform="translate(204.8 110) scale(0.6)"
    d="M360 420H664C740 420 790 460 806 540L836 680C850 750 800 800 744 784C712 775 690 750 668 720L640 680H384L356 720C334 750 312 775 280 784C224 800 174 750 188 680L218 540C234 460 284 420 360 420ZM352 505h36v37h37v36h-37v37h-36v-37h-37v-36h37zM631 518a23 23 0 1 0 46 0a23 23 0 1 0-46 0zM631 602a23 23 0 1 0 46 0a23 23 0 1 0-46 0zM589 560a23 23 0 1 0 46 0a23 23 0 1 0-46 0zM673 560a23 23 0 1 0 46 0a23 23 0 1 0-46 0z"/>
</svg>
