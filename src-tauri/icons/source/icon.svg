<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ferry app icon: a ferry carrying a gamepad across the water. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d70ff"/>
      <stop offset="1" stop-color="#6544ee"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="64" y="64" width="896" height="896" rx="210"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#tile)"/>

  <g clip-path="url(#tile-clip)">
    <!-- Water: a darker band under the boat -->
    <path fill="#5333d6" d="M64 712 C 150 680 214 680 300 712 S 450 744 536 712 S 686 680 772 712 S 900 744 960 712 V 960 H 64 Z"/>
    <!-- Wave lines -->
