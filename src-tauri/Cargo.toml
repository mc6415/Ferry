[package]
name = "ferry"
version = "0.5.0"
description = "Copy Steam games from a network share into your local Steam library"
authors = ["mcoombes"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows.
name = "ferry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
filetime = "0.2"
fs4 = "1"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri uses; lets us clear GTK's window background for the rounded, transparent window.
gtk = "0.18"
# O_DIRECT for unbuffered writes.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
